server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 200M;

    # ── Pretty page URLs (try_files; alias on /=/ is broken, rewrite+last loops with 301s) ──
    location = / {
        try_files /pages/main_page.html =404;
    }

    location = /home {
        return 301 /;
    }

    location = /places {
        try_files /pages/visitedPlaces/visited_places.html =404;
    }

    location = /places/map {
        try_files /pages/visitedPlaces/places_map_view.html =404;
    }

    location = /places/new {
        try_files /pages/visitedPlaces/add_new_place.html =404;
    }

    location = /trips {
        try_files /pages/routePlanner/planned_trips.html =404;
    }

    location = /trips/new {
        try_files /pages/routePlanner/plan_new_trip.html =404;
    }

    location = /share {
        try_files /pages/routePlanner/shared_trip.html =404;
    }

    location = /settings {
        try_files /pages/settings/settings.html =404;
    }

    location = /settings/profile {
        try_files /pages/settings/editProfile.html =404;
    }

    location = /profile {
        try_files /pages/loginRegister/profile.html =404;
    }

    location = /login {
        try_files /pages/loginRegister/loginPage.html =404;
    }

    location = /register {
        try_files /pages/loginRegister/registerPage.html =404;
    }

    location = /reset-password {
        try_files /pages/loginRegister/resetPassword.html =404;
    }

    location = /verify-email {
        try_files /pages/loginRegister/verifyEmail.html =404;
    }

    location = /admin {
        try_files /pages/admin/admin.html =404;
    }

    location = /admin/feedback {
        try_files /pages/admin/admin_feedback.html =404;
    }

    # ── Legacy .html paths → pretty URLs ──
    location = /pages/main_page.html { return 301 /; }
    location = /pages/visitedPlaces/visited_places.html { return 301 /places; }
    location = /pages/visitedPlaces/places_map_view.html { return 301 /places/map; }
    location = /pages/visitedPlaces/add_new_place.html { return 301 /places/new; }
    location = /pages/routePlanner/planned_trips.html { return 301 /trips; }
    location = /pages/routePlanner/plan_new_trip.html { return 301 /trips/new; }
    location = /pages/routePlanner/shared_trip.html { return 301 /share; }
    location = /pages/settings/settings.html { return 301 /settings; }
    location = /pages/settings/editProfile.html { return 301 /settings/profile; }
    location = /pages/loginRegister/profile.html { return 301 /profile; }
    location = /pages/loginRegister/loginPage.html { return 301 /login; }
    location = /pages/loginRegister/registerPage.html { return 301 /register; }
    location = /pages/loginRegister/resetPassword.html { return 301 /reset-password; }
    location = /pages/loginRegister/verifyEmail.html { return 301 /verify-email; }
    location = /pages/admin/admin.html { return 301 /admin; }
    location = /pages/admin/admin_feedback.html { return 301 /admin/feedback; }

    # Backend API / uploads
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /generate_travel_plans/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
