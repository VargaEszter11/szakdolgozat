server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Default is 1M, too small for the admin data-import endpoint (a full
    # DB export including base64-encoded photos can run several MB).
    client_max_body_size 200M;

    # Home page redirect (mirrors the old backend "/" -> main_page.html behavior).
    location = / {
        return 302 /pages/main_page.html;
    }

    # Public "pretty URL" entry points that used to be served by the backend.
    # Serving the file directly (not a redirect) keeps the token in the URL bar
    # so the page's own JS can read it from location.search.
    location = /share {
        default_type text/html;
        alias /usr/share/nginx/html/pages/routePlanner/shared_trip.html;
    }

    location = /reset-password {
        default_type text/html;
        alias /usr/share/nginx/html/pages/loginRegister/resetPassword.html;
    }

    # Everything the backend actually owns gets proxied through, unchanged, so
    # the browser only ever talks to this one origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /generate_travel_plans/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static frontend files (pages, scripts, styles, pictures).
    location / {
        try_files $uri $uri/ =404;
    }

    # JS/CSS have no cache-busting (no ?v= / hashed filenames), so without an
    # explicit header browsers may apply heuristic caching on a recently
    # modified file and silently keep serving a stale version after a deploy.
    # Force revalidation on every request instead (still cheap: a 304 when
    # unchanged, matching the file's ETag/Last-Modified).
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
