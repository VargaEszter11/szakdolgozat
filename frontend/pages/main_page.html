<!DOCTYPE html>
<html lang="en" data-defer-app-ready>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" href="../pictures/marker.png">
    <title>TravelApp – Main page</title>
    <script src="../scripts/utils/apiConfig.js"></script>
    <script src="../scripts/utils/themeLoader.js"></script>
    <script src="../scripts/utils/authGuard.js"></script>
    <script src="../scripts/utils/countries.js"></script>
    <script src="../scripts/i18n/translations.js" defer></script>
    <script src="../scripts/i18n/i18n.js" defer></script>
    <script src="../scripts/utils/sidebarHeader.js" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
</head>

<body>
    <div class="main-page main-page-home">
        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">
            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">
                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="mainPage.title">Welcome to TravelApp!</h1>
                        </div>
                        <a href="visitedPlaces/add_new_place.html" class="btn-add">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 8v8" />
                                <path d="M8 12h8" />
                            </svg>
                            <span data-i18n="nav.addPlace">Add Place</span>
                        </a>
                    </div>

                    <section class="main-page-panel" aria-labelledby="mainRecentHeading">
                        <div id="mainStatsStrip" class="main-stats-strip" aria-label="Travel stats" hidden></div>

                        <div class="main-page-panel-heading">
                            <h2 id="mainRecentHeading" class="main-page-panel-title" data-i18n="mainPage.recentVisits">
                                Most recent visits
                            </h2>
                            <a href="visitedPlaces/visited_places.html" class="main-page-panel-more"
                                data-i18n="mainPage.moreVisits">More</a>
                        </div>
                        <div id="mainTravelLogs" class="travel-logs-list" aria-live="polite">
                            <p class="travel-logs-loading muted" data-i18n="mainPage.loading">Loading…</p>
                        </div>

                        <h2 id="mainEuropeChartHeading" class="main-page-panel-title main-page-panel-title--chart"
                            data-i18n="mainPage.europeChartTitle">
                            European countries visited
                        </h2>
                        <p id="mainEuropeChartSummary" class="main-europe-chart-summary muted" hidden></p>
                        <div id="mainEuropeChart" class="main-europe-chart" aria-labelledby="mainEuropeChartHeading">
                            <div class="main-europe-coverage">
                                <div id="mainEuropeMap" class="main-europe-map" role="img"
                                    aria-label="Europe map of visited countries"></div>
                                <div id="mainEuropeDiagram" class="main-europe-diagram"></div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="../scripts/mainPage/index.js"></script>
</body>

</html>
