<!DOCTYPE html>
<html lang="en" data-defer-app-ready>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <script src="../../scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/add-place.css">
    <link rel="stylesheet" href="../../styles/admin.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title data-i18n="admin.feedbackBrowserTitle">Admin feedback – TravelApp</title>

    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/i18n/translations.js" defer></script>
    <script src="../../scripts/i18n/i18n.js" defer></script>
</head>

<body class="page-admin page-admin-feedback">
    <div class="main-page main-page-home">

        <header id="app-header" class="main-header main-page-home-header" style="display:none"></header>

        <div class="main-page-home-body">

            <aside id="app-sidebar" class="main-page-home-sidebar" style="display:none"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="admin.feedbackPageTitle">Admin: feedback</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="admin.feedbackPageSubtitle">
                                Messages submitted by users from their profile page
                            </p>
                        </div>
                    </div>

                    <div id="adminLoginCard" class="card add-place-card">
                        <form id="adminLoginForm" class="add-place-form">
                            <div class="form-group">
                                <label for="adminSecret" class="form-label" data-i18n="admin.secretLabel">Admin
                                    secret</label>
                                <input type="password" id="adminSecret" name="adminSecret" required class="form-input"
                                    data-i18n-placeholder="admin.secretPlaceholder"
                                    placeholder="Enter the admin secret">
                            </div>
                            <div class="form-actions">
                                <button type="submit" id="adminLoginSubmit" class="btn-add">
                                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                    </svg>
                                    <span data-i18n="admin.unlock">Unlock</span>
                                </button>
                            </div>
                        </form>
                    </div>

                    <div id="adminPanel" class="card add-place-card add-place-form hidden">
                        <nav class="admin-nav" aria-label="Admin sections">
                            <a href="admin.html" class="admin-nav-link" data-i18n="admin.navData">Data export / import</a>
                            <a href="admin_feedback.html" class="admin-nav-link is-active"
                                data-i18n="admin.navFeedback">Feedback</a>
                        </nav>

                        <p class="form-hint" data-i18n="admin.feedbackHint">
                            Messages submitted by users from their profile page.
                        </p>
                        <div id="adminFeedbackList" class="admin-feedback-list">
                            <p class="muted" data-i18n="admin.feedbackLoading">Loading…</p>
                        </div>

                        <p id="adminStatus" class="admin-message" hidden></p>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/admin/adminFeedback.js"></script>

</body>

</html>
