<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>Settings – TravelApp</title>
    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>
    <script src="../../scripts/utils/navToggle.js" defer></script>
    <script src="../../scripts/i18n/translations.js"></script>
    <script src="../../scripts/i18n/i18n.js"></script>
</head>

<body>
    <div class="main-page">
        <header class="main-header">
            <a href="../main_page.html" class="nav-logo">
                <img src="../../pictures/marker.png" alt="TravelApp">
            </a>
            <button class="hamburger-btn" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <nav class="main-nav">
                <a href="../visitedPlaces/visited_places.html" class="nav-link" data-i18n="nav.visitedPlaces">Visited
                    Places</a>
                <a href="../visitedPlaces/add_new_place.html" class="nav-link" data-i18n="nav.addNewPlace">Add New
                    Place</a>
                <a href="../routePlanner/plan_new_trip.html" class="nav-link" data-i18n="nav.planNewTrip">Plan New
                    Trip</a>
                <a href="../routePlanner/surprise_me.html" class="nav-link" data-i18n="nav.surpriseMe">Surprise Me!</a>
                <a href="../routePlanner/planned_trips.html" class="nav-link" data-i18n="nav.plannedTrips">Planned
                    Trips</a>
                <a href="../loginRegister/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
                <a href="settings.html" class="nav-link nav-link-active" data-i18n="nav.settings">Settings</a>
            </nav>
        </header>

        <main class="main-content">
            <div class="main-inner">
                <div class="profile-page">
                    <div class="route-planner-header">
                        <h1 class="route-planner-title" data-i18n="settings.title">Settings</h1>
                        <p class="route-planner-subtitle" data-i18n="settings.subtitle">Customize your TravelApp
                            experience</p>
                    </div>

                    <!-- Theme Settings -->
                    <section class="card add-place-card">
                        <h2 class="section-title" data-i18n="settings.appearance">Appearance</h2>
                        <div class="form-group">
                            <label for="themeSelect" class="form-label" data-i18n="settings.theme">Theme</label>
                            <select id="themeSelect" name="theme" class="form-input">
                                <option value="light" data-i18n="settings.themeLight">Light</option>
                                <option value="dark" data-i18n="settings.themeDark">Dark</option>
                                <option value="auto" data-i18n="settings.themeAuto">Auto (System)</option>
                            </select>
                            <small class="form-hint" data-i18n="settings.themeHint">Choose your preferred color
                                theme</small>
                        </div>
                    </section>

                    <!-- Language Settings -->
                    <section class="card add-place-card">
                        <h2 class="section-title" data-i18n="settings.language">Language</h2>
                        <div class="form-group">
                            <label for="languageSelect" class="form-label"
                                data-i18n="settings.language">Language</label>
                            <select id="languageSelect" name="language" class="form-input">
                                <option value="en" data-i18n="settings.langOptionEn">English</option>
                                <option value="hu" data-i18n="settings.langOptionHu">Magyar (Hungarian)</option>
                                <option value="de" data-i18n="settings.langOptionDe">Deutsch (German)</option>
                            </select>
                            <small class="form-hint" data-i18n="settings.languageHint">Select your preferred
                                language</small>
                        </div>
                    </section>

                    <!-- Save Button -->
                    <section class="card add-place-card">
                        <div class="form-actions">
                            <button type="button" id="saveSettings" class="btn-add">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                                    <polyline points="17 21 17 13 7 13 7 21" />
                                    <polyline points="7 3 7 8 15 8" />
                                </svg>
                                <span data-i18n="settings.saveSettings">Save Settings</span>
                            </button>
                            <a href="../main_page.html" class="btn-cancel" data-i18n="settings.cancel">Cancel</a>
                        </div>
                        <div id="saveMessage" class="settings-saved-message" data-i18n="settings.savedMessage">Settings
                            saved successfully!</div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script src="../../scripts/settings/settings.js"></script>
</body>

</html>
