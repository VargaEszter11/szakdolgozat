<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/add-place.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>Settings – TravelApp</title>

    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>
    <script src="../../scripts/i18n/translations.js" defer></script>
    <script src="../../scripts/i18n/i18n.js" defer></script>
    <script src="../../scripts/utils/sidebarHeader.js" defer></script>
</head>

<body class="page-settings">
    <div class="main-page main-page-home">
        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">
            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="settings.title">Settings</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="settings.subtitle">
                                Customize your TravelApp experience
                            </p>
                        </div>
                    </div>

                    <div class="card add-place-card">
                        <form id="settingsForm" class="add-place-form">

                            <div class="form-group">
                                <label for="themeSelect" class="form-label" data-i18n="settings.theme">Theme</label>
                                <select id="themeSelect" name="theme" class="form-input">
                                    <option value="light" data-i18n="settings.themeLight">Light</option>
                                    <option value="dark" data-i18n="settings.themeDark">Dark</option>
                                    <option value="auto" data-i18n="settings.themeAuto">Auto (System)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="languageSelect" class="form-label"
                                    data-i18n="settings.language">Language</label>
                                <select id="languageSelect" name="language" class="form-input">
                                    <option value="en" data-i18n="settings.langOptionEn">English</option>
                                    <option value="hu" data-i18n="settings.langOptionHu">Magyar</option>
                                    <option value="de" data-i18n="settings.langOptionDe">Deutsch</option>
                                </select>
                            </div>

                            <div class="form-actions">
                                <button type="submit" id="saveSettings" class="btn-add">
                                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                                        <polyline points="17 21 17 13 7 13 7 21" />
                                        <polyline points="7 3 7 8 15 8" />
                                    </svg>
                                    <span data-i18n="settings.saveSettings">Save Settings</span>
                                </button>
                                <a href="../main_page.html" class="btn-cancel" data-i18n="settings.cancel">Cancel</a>
                            </div>

                            <p id="saveMessage" class="settings-saved-message" data-i18n="settings.savedMessage"
                                role="status" aria-live="polite" hidden>
                                Settings saved successfully!
                            </p>
                        </form>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="../../scripts/settings/settings.js" defer></script>
</body>

</html>
