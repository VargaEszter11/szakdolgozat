<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/add-place.css">
    <link rel="icon" href="/pictures/marker.png">
    <title data-i18n="settings.pageTitle">Settings – Planventure</title>

    <script src="/scripts/utils/themeLoader.js"></script>
    <script src="/scripts/utils/authGuard.js"></script>
    <script src="/scripts/i18n/translations.js" defer></script>
    <script src="/scripts/i18n/i18n.js" defer></script>
    <script src="/scripts/utils/sidebarHeader.js" defer></script>
    <script src="/scripts/utils/dropdown.js" defer></script>
</head>

<body class="page-settings">
    <div class="main-page main-page-home">
        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">
            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="settings.title">Settings</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="settings.subtitle">
                                Customize your Planventure experience
                            </p>
                        </div>
                    </div>

                    <div class="card add-place-card">
                        <form id="settingsForm" class="add-place-form">

                            <div class="form-group">
                                <span class="form-label" id="themeSelectLabel" data-i18n="settings.theme">Theme</span>
                                <div class="app-dropdown">
                                    <button type="button" class="form-input app-dropdown-trigger"
                                        id="themeSelectTrigger" aria-haspopup="listbox" aria-expanded="false"
                                        aria-labelledby="themeSelectLabel">
                                        <span class="app-dropdown-label"></span>
                                    </button>
                                    <ul class="app-dropdown-list" id="themeSelectList" role="listbox"
                                        aria-labelledby="themeSelectLabel" hidden>
                                        <li class="app-dropdown-option" role="option" data-value="light" tabindex="-1">
                                            <span class="app-dropdown-name" data-i18n="settings.themeLight">Light</span>
                                        </li>
                                        <li class="app-dropdown-option" role="option" data-value="dark" tabindex="-1">
                                            <span class="app-dropdown-name" data-i18n="settings.themeDark">Dark</span>
                                        </li>
                                        <li class="app-dropdown-option" role="option" data-value="auto" tabindex="-1">
                                            <span class="app-dropdown-name" data-i18n="settings.themeAuto">Auto
                                                (System)</span>
                                        </li>
                                    </ul>
                                    <input type="hidden" id="themeSelect" name="theme" value="dark">
                                </div>
                            </div>

                            <div class="form-group">
                                <span class="form-label" id="languageSelectLabel"
                                    data-i18n="settings.language">Language</span>
                                <div class="app-dropdown">
                                    <button type="button" class="form-input app-dropdown-trigger"
                                        id="languageSelectTrigger" aria-haspopup="listbox" aria-expanded="false"
                                        aria-labelledby="languageSelectLabel">
                                        <span class="app-dropdown-label"></span>
                                    </button>
                                    <ul class="app-dropdown-list" id="languageSelectList" role="listbox"
                                        aria-labelledby="languageSelectLabel" hidden>
                                        <li class="app-dropdown-option" role="option" data-value="en" tabindex="-1">
                                            <span class="app-dropdown-name"
                                                data-i18n="settings.langOptionEn">English</span>
                                        </li>
                                        <li class="app-dropdown-option" role="option" data-value="hu" tabindex="-1">
                                            <span class="app-dropdown-name" data-i18n="settings.langOptionHu">Magyar
                                                (Hungarian)</span>
                                        </li>
                                        <li class="app-dropdown-option" role="option" data-value="de" tabindex="-1">
                                            <span class="app-dropdown-name" data-i18n="settings.langOptionDe">Deutsch
                                                (German)</span>
                                        </li>
                                    </ul>
                                    <input type="hidden" id="languageSelect" name="language" value="en">
                                </div>
                            </div>

                            <p id="settingsSavedMessage" class="settings-saved-message" role="status" hidden
                                data-i18n="settings.savedMessage">Settings saved
                                successfully!</p>

                            <div class="form-actions">
                                <button type="submit" class="btn-add">
                                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                                        <polyline points="17 21 17 13 7 13 7 21" />
                                        <polyline points="7 3 7 8 15 8" />
                                    </svg>
                                    <span data-i18n="settings.saveSettings">Save Settings</span>
                                </button>
                                <a href="/" id="cancelBtn" class="btn-cancel" data-i18n="settings.cancel">Cancel</a>
                            </div>
                        </form>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="/scripts/settings/settings.js" defer></script>
</body>

</html>
