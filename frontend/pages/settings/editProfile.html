<!DOCTYPE html>
<html lang="en" data-defer-app-ready>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/editprofile.css">
    <link rel="icon" href="/pictures/marker.png">
    <title data-i18n="editProfile.pageTitle">Edit profile – TravelApp</title>

    <script src="/scripts/utils/apiConfig.js"></script>
    <script src="/scripts/utils/themeLoader.js"></script>
    <script src="/scripts/utils/authGuard.js"></script>
    <script src="/scripts/i18n/translations.js" defer></script>
    <script src="/scripts/i18n/i18n.js" defer></script>
    <script src="/scripts/utils/sidebarHeader.js" defer></script>
</head>

<body class="page-edit-profile">
    <div class="main-page main-page-home">
        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">
            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="editProfile.title">Edit profile</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="editProfile.subtitle">
                                Update your username, email, or password
                            </p>
                        </div>
                    </div>

                    <div class="card edit-profile-card">
                        <form id="editProfileForm" class="edit-profile-form">

                            <div class="form-group">
                                <label for="profileUsername" class="form-label" data-i18n="editProfile.username">
                                    Username
                                </label>
                                <input type="text" id="profileUsername" name="username" required minlength="3"
                                    maxlength="50" autocomplete="username" class="form-input"
                                    data-i18n-placeholder="register.usernamePlaceholder"
                                    placeholder="Choose a username">
                            </div>

                            <div class="form-group">
                                <label for="profileEmail" class="form-label" data-i18n="editProfile.email">Email</label>
                                <input type="email" id="profileEmail" name="email" required autocomplete="email"
                                    class="form-input" data-i18n-placeholder="register.emailPlaceholder"
                                    placeholder="Your email">
                            </div>

                            <div class="form-group">
                                <label for="profileHomeCity" class="form-label" data-i18n="editProfile.homeCity">Home
                                    city</label>
                                <input type="text" id="profileHomeCity" name="homeCity" maxlength="255"
                                    class="form-input" data-i18n-placeholder="editProfile.homeCityPlaceholder"
                                    placeholder="e.g. Budapest">
                                <p class="form-hint" data-i18n="editProfile.homeCityHint">
                                    Used to fill in the starting city with one click when planning a new trip.
                                </p>
                            </div>

                            <h2 class="main-page-panel-title" data-i18n="editProfile.passwordSection">Change password
                            </h2>
                            <p class="form-hint" data-i18n="editProfile.passwordHint">
                                Leave blank to keep your current password.
                            </p>

                            <div class="form-group">
                                <label for="profileNewPassword" class="form-label" data-i18n="editProfile.newPassword">
                                    New password
                                </label>
                                <input type="password" id="profileNewPassword" name="newPassword" minlength="6"
                                    autocomplete="new-password" class="form-input"
                                    data-i18n-placeholder="register.passwordPlaceholder"
                                    placeholder="Choose a password">
                            </div>

                            <div class="form-group">
                                <label for="profileConfirmPassword" class="form-label"
                                    data-i18n="editProfile.confirmPassword">
                                    Confirm new password
                                </label>
                                <input type="password" id="profileConfirmPassword" name="confirmPassword" minlength="6"
                                    autocomplete="new-password" class="form-input"
                                    data-i18n-placeholder="register.confirmPasswordPlaceholder"
                                    placeholder="Confirm your password">
                            </div>

                            <p id="editProfileSuccess" class="edit-profile-message edit-profile-message--success"
                                role="status" hidden></p>
                            <p id="editProfileError" class="edit-profile-message edit-profile-message--error"
                                role="alert" hidden></p>

                            <div class="form-actions">
                                <button type="submit" id="saveProfileBtn" class="btn-add">
                                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                                        <polyline points="17 21 17 13 7 13 7 21" />
                                        <polyline points="7 3 7 8 15 8" />
                                    </svg>
                                    <span data-i18n="editProfile.save">Save changes</span>
                                </button>
                                <a href="/profile" class="btn-cancel"
                                    data-i18n="editProfile.cancel">Cancel</a>
                            </div>

                        </form>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="/scripts/settings/editProfile.js" defer></script>
</body>

</html>
