<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/register.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>Register – TravelApp</title>

    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>

    <script src="../../scripts/i18n/translations.js" defer></script>
    <script src="../../scripts/i18n/i18n.js" defer></script>
    <script src="../../scripts/utils/sidebarHeader.js" defer></script>
</head>

<body class="page-register">
    <div class="main-page main-page-home">

        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">

            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="register.title">Register</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="register.subtitle">
                                Create your TravelApp account
                            </p>
                        </div>
                    </div>

                    <div class="card">
                        <form id="registerForm" class="register-form">

                            <div class="form-group">
                                <label for="username" class="form-label" data-i18n="register.username">Username
                                    *</label>
                                <input type="text" id="username" name="username" required class="form-input"
                                    data-i18n-placeholder="register.usernamePlaceholder"
                                    placeholder="Choose a username">
                            </div>

                            <div class="form-group">
                                <label for="email" class="form-label" data-i18n="register.email">Email *</label>
                                <input type="email" id="email" name="email" required class="form-input"
                                    data-i18n-placeholder="register.emailPlaceholder" placeholder="Your email">
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label" data-i18n="register.password">Password
                                    *</label>

                                <div class="password-wrapper">
                                    <input type="password" id="password" name="password" required class="form-input"
                                        data-i18n-placeholder="register.passwordPlaceholder"
                                        placeholder="Choose a password">

                                    <button type="button" class="password-toggle" aria-label="Show password">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" style="display:none">
                                            <path
                                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                            <line x1="1" y1="1" x2="23" y2="23" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword" class="form-label"
                                    data-i18n="register.confirmPassword">Confirm Password *</label>

                                <div class="password-wrapper">
                                    <input type="password" id="confirmPassword" name="confirmPassword" required
                                        class="form-input" data-i18n-placeholder="register.confirmPasswordPlaceholder"
                                        placeholder="Confirm your password">

                                    <button type="button" class="password-toggle" aria-label="Show password">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" style="display:none">
                                            <path
                                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                            <line x1="1" y1="1" x2="23" y2="23" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-add" data-i18n="register.register">Register</button>
                                <a href="loginPage.html" class="btn-cancel" data-i18n="register.cancel">Cancel</a>
                            </div>

                        </form>
                    </div>

                    <p class="muted" data-i18n="register.alreadyHaveAnAccount">
                        Already have an account? <a href="loginPage.html">Log in here</a>
                    </p>

                </div>
            </main>
        </div>
    </div>

    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/loginRegister/passwordToggle.js"></script>
    <script src="../../scripts/loginRegister/register.js" defer></script>

</body>

</html>
