<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/login.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title data-i18n="resetPassword.pageTitle">Reset Password – TravelApp</title>

    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>

    <script src="../../scripts/i18n/translations.js" defer></script>
    <script src="../../scripts/i18n/i18n.js" defer></script>
</head>

<body class="page-login">
    <div class="main-page main-page-home">

        <header id="app-header" class="main-header main-page-home-header" style="display:none"></header>

        <div class="main-page-home-body">

            <aside id="app-sidebar" class="main-page-home-sidebar" style="display:none"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="resetPassword.title">Set new password</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="resetPassword.subtitle">
                                Choose a new password for your account
                            </p>
                        </div>
                    </div>

                    <div id="resetPasswordCard" class="card">
                        <form id="resetPasswordForm" class="login-form">

                            <div class="form-group">
                                <label for="newPassword" class="form-label" data-i18n="resetPassword.newPassword">New
                                    password *</label>
                                <div class="password-wrapper">
                                    <input type="password" id="newPassword" name="newPassword" required minlength="6"
                                        class="form-input" data-i18n-placeholder="resetPassword.newPasswordPlaceholder"
                                        placeholder="New password (min. 6 characters)">
                                    <button type="button" class="password-toggle" aria-label="Show password">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" style="display:none">
                                            <path
                                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                            <line x1="1" y1="1" x2="23" y2="23" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword" class="form-label"
                                    data-i18n="resetPassword.confirmPassword">Confirm new password *</label>
                                <div class="password-wrapper">
                                    <input type="password" id="confirmPassword" name="confirmPassword" required
                                        minlength="6" class="form-input"
                                        data-i18n-placeholder="resetPassword.confirmPasswordPlaceholder"
                                        placeholder="Confirm new password">
                                    <button type="button" class="password-toggle" aria-label="Show password">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" style="display:none">
                                            <path
                                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                            <line x1="1" y1="1" x2="23" y2="23" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" id="resetPasswordSubmit" class="btn-add"
                                    data-i18n="resetPassword.submit">Reset password</button>
                                <a href="/pages/loginRegister/loginPage.html" class="btn-cancel"
                                    data-i18n="resetPassword.cancel">Cancel</a>
                            </div>

                        </form>
                    </div>

                    <div id="resetPasswordInvalid" class="card hidden">
                        <p data-i18n="resetPassword.invalidLinkMessage">This password reset link is invalid or has
                            expired. Please request a new one from the login page.</p>
                        <p class="muted"><a href="/pages/loginRegister/loginPage.html"
                                data-i18n="resetPassword.backToLogin">Back to
                                login</a></p>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/loginRegister/passwordToggle.js"></script>
    <script src="../../scripts/loginRegister/resetPassword.js"></script>

</body>

</html>
