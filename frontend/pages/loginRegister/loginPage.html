<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/login.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title data-i18n="login.pageTitle">Log in – TravelApp</title>

    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>

    <script src="../../scripts/i18n/translations.js" defer></script>
    <script src="../../scripts/i18n/i18n.js" defer></script>
    <script src="../../scripts/utils/sidebarHeader.js" defer></script>
</head>

<body class="page-login">
    <div class="main-page main-page-home">

        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">

            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="login.title">Log in</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="login.subtitle">
                                Sign in to your TravelApp account
                            </p>
                        </div>
                    </div>

                    <div class="card">
                        <form id="loginForm" class="login-form">

                            <div class="form-group">
                                <label for="username" class="form-label" data-i18n="login.username">Username *</label>
                                <input type="text" id="username" name="username" required class="form-input"
                                    data-i18n-placeholder="login.usernamePlaceholder" placeholder="Your username">
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label" data-i18n="login.password">Password *</label>

                                <div class="password-wrapper">
                                    <input type="password" id="password" name="password" required class="form-input"
                                        data-i18n-placeholder="login.passwordPlaceholder" placeholder="Your password">

                                    <button type="button" class="password-toggle" aria-label="Show password">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="20"
                                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" style="display:none">
                                            <path
                                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                            <line x1="1" y1="1" x2="23" y2="23" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-add" data-i18n="login.login">Log in</button>
                                <a href="registerPage.html" class="btn-cancel" data-i18n="login.cancel">Cancel</a>
                            </div>

                        </form>

                        <div class="google-login-divider">
                            <span data-i18n="login.googleOrContinue">or continue with</span>
                        </div>
                        <div id="googleSignInButton" class="google-signin-host">
                            <button type="button" id="googleSignInBtn" class="google-signin-btn" disabled>
                                <svg class="google-signin-icon" width="18" height="18" viewBox="0 0 18 18"
                                    aria-hidden="true" focusable="false">
                                    <path fill="#4285F4"
                                        d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" />
                                    <path fill="#34A853"
                                        d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" />
                                    <path fill="#FBBC05"
                                        d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" />
                                    <path fill="#EA4335"
                                        d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z" />
                                </svg>
                                <span data-i18n="login.googleContinue">Continue with Google</span>
                            </button>
                        </div>
                    </div>

                    <p class="muted">
                        <a href="#" id="forgotPasswordLink">Forgot your password?</a>
                    </p>

                    <p class="muted" data-i18n="login.dontHaveAnAccount">
                        Don't have an account? <a href="registerPage.html">Register here</a>
                    </p>

                </div>
            </main>
        </div>
    </div>

    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/loginRegister/forgotPassword.js"></script>
    <script src="../../scripts/loginRegister/passwordToggle.js"></script>
    <script src="../../scripts/loginRegister/login.js" defer></script>

</body>

</html>
