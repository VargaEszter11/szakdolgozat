<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>Log in – TravelApp</title>
    <script src="../../scripts/themeLoader.js"></script>
    <script src="../../scripts/navToggle.js" defer></script>
    <script src="../../scripts/i18n/translations.js"></script>
    <script src="../../scripts/i18n/i18n.js"></script>
</head>

<body>
    <div class="main-page">
        <header class="main-header">
            <a href="../main_page.html" class="nav-logo">
                <img src="../../pictures/marker.png" alt="TravelApp">
            </a>
            <button class="hamburger-btn" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <nav class="main-nav">
                <a href="../visitedPlaces/visited_places.html" class="nav-link" data-i18n="nav.visitedPlaces">Visited
                    Places</a>
                <a href="../visitedPlaces/add_new_place.html" class="nav-link" data-i18n="nav.addNewPlace">Add New
                    Place</a>
                <a href="../routePlanner/plan_new_trip.html" class="nav-link" data-i18n="nav.planNewTrip">Plan New
                    Trip</a>
                <a href="../routePlanner/surprise_me.html" class="nav-link" data-i18n="nav.surpriseMe">Surprise Me!</a>
                <a href="../routePlanner/planned_trips.html" class="nav-link" data-i18n="nav.plannedTrips">Planned
                    Trips</a>
                <a href="profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
                <a href="../settings/settings.html" class="nav-link" data-i18n="nav.settings">Settings</a>
            </nav>
        </header>

        <main class="main-content route-planner-page">
            <div class="route-planner-inner">
                <div class="route-planner-header">
                    <h1 class="route-planner-title" data-i18n="login.title">Log in</h1>
                    <p class="route-planner-subtitle" data-i18n="login.subtitle">Sign in to your TravelApp account</p>
                </div>

                <div class="card add-place-card">
                    <form id="loginForm" class="add-place-form">
                        <div class="form-group">
                            <label for="username" class="form-label" data-i18n="login.username">Username *</label>
                            <input type="text" id="username" name="username" required class="form-input"
                                data-i18n-placeholder="login.usernamePlaceholder" placeholder="Your username">
                        </div>
                        <div class="form-group">
                            <label for="password" class="form-label" data-i18n="login.password">Password *</label>
                            <input type="password" id="password" name="password" required class="form-input"
                                data-i18n-placeholder="login.passwordPlaceholder" placeholder="Your password">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-submit" data-i18n="login.login">Log in</button>
                            <a href="profile.html" class="btn-cancel" data-i18n="login.cancel">Cancel</a>
                        </div>
                    </form>
                </div>

                <p class="auth-switch muted" data-i18n="login.dontHaveAnAccount">
                    Don't have an account? <a href="registerPage.html">Register here</a>
                </p>
            </div>
        </main>
    </div>
    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/loginRegister/login.js"></script>
</body>

</html>
