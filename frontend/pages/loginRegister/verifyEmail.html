<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="icon" href="/pictures/marker.png">
    <title data-i18n="verifyEmail.pageTitle">Confirm email – Planventure</title>

    <script src="/scripts/utils/apiConfig.js"></script>
    <script src="/scripts/utils/themeLoader.js"></script>
    <script src="/scripts/i18n/translations.js" defer></script>
    <script src="/scripts/i18n/i18n.js" defer></script>
</head>

<body class="page-login">
    <div class="main-page main-page-home">
        <header id="app-header" class="main-header main-page-home-header" style="display:none"></header>
        <div class="main-page-home-body">
            <aside id="app-sidebar" class="main-page-home-sidebar" style="display:none"></aside>
            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="verifyEmail.title">Confirm your email</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="verifyEmail.subtitle">
                                Finish creating your account
                            </p>
                        </div>
                    </div>

                    <div id="verifyEmailPending" class="card">
                        <p class="form-hint" data-i18n="verifyEmail.pending">Confirming your email…</p>
                    </div>

                    <div id="verifyEmailSuccess" class="card hidden">
                        <p data-i18n="verifyEmail.successMessage">Your email is confirmed. You can log in now.</p>
                        <div class="form-actions">
                            <a href="/login" class="btn-add" data-i18n="verifyEmail.backToLogin">Back to login</a>
                        </div>
                    </div>

                    <div id="verifyEmailInvalid" class="card hidden">
                        <p data-i18n="verifyEmail.invalidLinkMessage">
                            This confirmation link is invalid or has expired. Register again or ask for a new link from
                            the login page.
                        </p>
                        <div class="form-actions">
                            <a href="/login" class="btn-add" data-i18n="verifyEmail.backToLogin">Back to login</a>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="/scripts/loginRegister/verifyEmail.js"></script>
</body>

</html>
