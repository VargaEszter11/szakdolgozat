<!DOCTYPE html>
<html lang="en" data-defer-app-ready>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../scripts/utils/boot.js"></script>
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../../styles/visited-places.css">
  <link rel="stylesheet" href="../../styles/map-view.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" href="../../pictures/marker.png">
  <title>Map View – TravelApp</title>
  <script src="../../scripts/utils/apiConfig.js"></script>
  <script src="../../scripts/utils/themeLoader.js"></script>
  <script src="../../scripts/utils/authGuard.js"></script>
  <script src="../../scripts/utils/countries.js"></script>
  <script src="../../scripts/utils/sidebarHeader.js"></script>
  <script src="../../scripts/utils/navToggle.js" defer></script>
  <script src="../../scripts/i18n/translations.js"></script>
  <script src="../../scripts/i18n/i18n.js"></script>
</head>

<body>
  <div class="main-page main-page-home">

    <header id="app-header" class="main-header main-page-home-header"></header>

    <div class="main-page-home-body">

      <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

      <main class="main-content main-page-home-content visited-places-page">
        <div class="main-page-home-content-inner">

          <div class="main-page-home-content-header">
            <div class="main-page-home-intro">
              <h1 class="main-page-home-title" data-i18n="visitedPlaces.mapViewTitle">
                Map View
              </h1>
              <p class="main-page-home-subtitle muted" data-i18n="visitedPlaces.mapViewSubtitle">
                See all your visited places on the map
              </p>
            </div>

            <div class="visited-places-header-actions">
              <a href="visited_places.html" class="btn-add btn-add-outline">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6" />
                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
                <span data-i18n="map.listView">List View</span>
              </a>
            </div>
          </div>

          <div class="map-view-wrap">
            <div id="map"></div>
            <div class="map-controls">
              <a href="visited_places.html" class="btn-add btn-add-outline" data-i18n="map.listView">List View</a>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../scripts/visitedPlaces/loadPlacesMap.js" defer></script>
</body>

</html>
