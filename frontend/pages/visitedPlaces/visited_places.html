<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/main-page.css">
    <link rel="stylesheet" href="../../styles/visited-places.css">
    <link rel="icon" href="../pictures/marker.png">
    <title>Visited Places – TravelApp</title>
    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>
    <script src="../../scripts/i18n/translations.js"></script>
    <script src="../../scripts/i18n/i18n.js"></script>
    <script src="../../scripts/utils/sidebarHeader.js"></script>
</head>

<body>
    <div class="main-page-home">

        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">

            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content visited-places-page">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div>
                            <h1 class="main-page-home-title" data-i18n="visitedPlaces.title">
                                Visited Places
                            </h1>
                            <p class="muted" data-i18n="visitedPlaces.subtitle">
                                Your travel memories and experiences
                            </p>
                        </div>

                        <div class="visited-places-header-actions">
                            <a href="add_new_place.html" class="btn-add">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M12 8v8" />
                                    <path d="M8 12h8" />
                                </svg>
                                <span data-i18n="nav.addNewPlace">Add Place</span>
                            </a>
                            <a href="places_map_view.html" class="btn-trip btn-trip-secondary"
                                data-i18n="visitedPlaces.mapView">
                                Map View
                            </a>
                        </div>
                    </div>

                    <div id="placeCards" class="travel-logs-list" aria-live="polite">
                    </div>

                    <div class="card visited-places-footer">
                        <p class="visited-places-count">
                            <span id="placeCount" class="font-semibold">0</span>
                            <span id="placeCountSuffix" data-i18n="visitedPlaces.placesCountSuffix">
                                places visited so far. Keep exploring!
                            </span>
                        </p>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/visitedPlaces/loadPlaces.js" defer></script>

</body>

</html>
