<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>Visited Places – TravelApp</title>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>
    <script src="../../scripts/utils/navToggle.js" defer></script>
    <script src="../../scripts/i18n/translations.js"></script>
    <script src="../../scripts/i18n/i18n.js"></script>
</head>

<body>
    <div class="main-page">
        <header class="main-header">
            <a href="../main_page.html" class="nav-logo">
                <img src="../../pictures/marker.png" alt="TravelApp">
            </a>
            <button class="hamburger-btn" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <nav class="main-nav">
                <a href="visited_places.html" class="nav-link nav-link-active" data-i18n="nav.visitedPlaces">Visited
                    Places</a>
                <a href="add_new_place.html" class="nav-link" data-i18n="nav.addNewPlace">Add New Place</a>
                <a href="../routePlanner/plan_new_trip.html" class="nav-link" data-i18n="nav.planNewTrip">Plan New
                    Trip</a>
                <a href="../routePlanner/surprise_me.html" class="nav-link" data-i18n="nav.surpriseMe">Surprise Me!</a>
                <a href="../routePlanner/planned_trips.html" class="nav-link" data-i18n="nav.plannedTrips">Planned
                    Trips</a>
                <a href="../loginRegister/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
                <a href="../settings/settings.html" class="nav-link" data-i18n="nav.settings">Settings</a>
            </nav>
        </header>

        <main class="main-content visited-places-page">
            <div class="visited-places-inner">
                <div class="visited-places-header">
                    <h1 class="visited-places-title" data-i18n="visitedPlaces.title">Visited Places</h1>
                    <p class="visited-places-subtitle" data-i18n="visitedPlaces.subtitle">Your travel memories and
                        experiences</p>
                </div>

                <div id="placeCards" class="place-cards">
                    <!-- Place cards rendered by loadPlaces.js -->
                </div>

                <div class="visited-places-footer card">
                    <p class="visited-places-count">
                        <span id="placeCount" class="font-semibold">0</span> <span id="placeCountSuffix"
                            data-i18n="visitedPlaces.placesCountSuffix">places visited so far. Keep exploring!</span>
                    </p>
                </div>

                <div class="visited-places-actions">
                    <a href="places_map_view.html" class="btn-trip btn-trip-secondary"
                        data-i18n="visitedPlaces.mapView">Map View</a>
                </div>
            </div>
        </main>
    </div>

    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/visitedPlaces/loadPlaces.js"></script>
</body>

</html>
