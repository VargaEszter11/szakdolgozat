<!DOCTYPE html>
<html lang="en" data-defer-app-ready>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/add-place.css">
    <link rel="stylesheet" href="../../styles/imageUpload.css">
    <link rel="stylesheet" href="../../styles/visited-places.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title data-i18n="visitedPlaces.pageTitle">Visited Places – TravelApp</title>
    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>
    <script src="../../scripts/utils/imageUpload.js"></script>
    <script src="../../scripts/utils/dropdown.js"></script>
    <script src="../../scripts/utils/countries.js"></script>
    <script src="../../scripts/i18n/translations.js"></script>
    <script src="../../scripts/i18n/i18n.js"></script>
    <script src="../../scripts/utils/sidebarHeader.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/hu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/de.js"></script>
</head>

<body>
    <div class="main-page main-page-home">

        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">

            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content visited-places-page">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="visitedPlaces.title">
                                Visited Places
                            </h1>
                            <p class="main-page-home-subtitle muted" data-i18n="visitedPlaces.subtitle">
                                Your travel memories and experiences
                            </p>
                        </div>

                        <div class="visited-places-header-actions">
                            <a href="add_new_place.html" class="btn-add">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M12 8v8" />
                                    <path d="M8 12h8" />
                                </svg>
                                <span data-i18n="nav.addPlace">Add Place</span>
                            </a>
                            <a href="places_map_view.html" class="btn-add btn-add-outline">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
                                    <line x1="9" y1="3" x2="9" y2="18" />
                                    <line x1="15" y1="6" x2="15" y2="21" />
                                </svg>
                                <span data-i18n="visitedPlaces.mapView">Map View</span>
                            </a>
                        </div>
                    </div>

                    <div id="placeCards" class="travel-logs-list" aria-live="polite">
                    </div>

                    <div class="card visited-places-footer">
                        <p class="visited-places-count">
                            <span id="placeCount" class="font-semibold">0</span>
                            <span id="placeCountSuffix" data-i18n="visitedPlaces.placesCountSuffix">
                                places visited so far. Keep exploring!
                            </span>
                        </p>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script src="../../scripts/loginRegister/modal.js"></script>
    <script src="../../scripts/visitedPlaces/loadPlaces.js" defer></script>

    <template id="placeDetailsModalTemplate">
        <div class="place-details-overlay visited-place-details-overlay" role="dialog" aria-modal="true"
            aria-labelledby="placeDetailsTitle">
            <div class="place-details-panel visited-place-details-panel" id="placeDetailsModalBox">
                <div class="place-details-header">
                    <div class="place-details-title-wrap">
                        <svg class="place-details-pin" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M12 21s-6-5.686-6-10a6 6 0 1 1 12 0c0 4.314-6 10-6 10z" />
                            <circle cx="12" cy="11" r="2" />
                        </svg>
                        <h2 id="placeDetailsTitle" class="place-details-title"></h2>
                    </div>
                    <button type="button" class="place-details-close" data-place-details-close
                        aria-label="Close" data-i18n-aria-label="visitedPlaces.detailsClose">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <div class="place-details-body">
                    <div class="place-details-meta">
                        <p id="placeDetailsCountryRow">
                            <strong data-i18n="visitedPlaces.detailsCountry">Country</strong>
                            <span id="placeDetailsCountry"></span>
                        </p>
                        <p>
                            <strong data-i18n="visitedPlaces.detailsDateLabel">Date visited</strong>
                            <span id="placeDetailsDate"></span>
                        </p>
                        <p id="placeDetailsRatingRow">
                            <strong data-i18n="visitedPlaces.detailsRatingLabel">Rating</strong>
                            <span id="placeDetailsRating"></span>
                        </p>
                        <p id="placeDetailsCoordsRow" class="hidden">
                            <strong data-i18n="visitedPlaces.detailsLocation">Location</strong>
                            <a id="placeDetailsMapLink" class="place-details-map-link" href="#" target="_blank"
                                rel="noopener noreferrer"></a>
                        </p>
                    </div>
                    <div id="placeDetailsPhotosSection" class="place-details-section">
                        <h3 id="placeDetailsPhotosHeading" data-i18n="visitedPlaces.detailsPhotosHeading">Photos</h3>
                        <div class="place-details-photo-grid" id="placeDetailsPhotoGrid"></div>
                        <p id="placeDetailsNoPhotos" class="place-details-muted hidden"
                            data-i18n="visitedPlaces.detailsNoPhotos">No photos for this place yet.</p>
                    </div>
                    <div class="place-details-section place-details-notes">
                        <h3 data-i18n="visitedPlaces.detailsDescriptionHeading">Description</h3>
                        <div id="placeDetailsDescription" class="place-details-description"></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

</body>

</html>
