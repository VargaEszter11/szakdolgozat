<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/add-place.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>TravelApp – Add New Place</title>

    <script src="../../scripts/utils/apiConfig.js"></script>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>
    <script src="../../scripts/utils/countries.js"></script>
    <script src="../../scripts/i18n/translations.js" defer></script>
    <script src="../../scripts/i18n/i18n.js" defer></script>
    <script src="../../scripts/utils/sidebarHeader.js" defer></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/hu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/de.js"></script>
</head>

<body class="page-add-new-place">
    <div class="main-page main-page-home">
        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">
            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="addNewPlace.title">Add New Place</h1>
                            <p class="main-page-home-subtitle muted" data-i18n="addNewPlace.subtitle">
                                Document your latest travel adventure
                            </p>
                        </div>
                    </div>

                    <div class="card add-place-card">
                        <form id="addPlaceForm" class="add-place-form">

                            <div class="form-group">
                                <label for="placeName" class="form-label" data-i18n="addNewPlace.placeName">
                                    Place Name *
                                </label>
                                <input type="text" id="placeName" name="placeName" required
                                    data-i18n-placeholder="addNewPlace.placeNamePlaceholder"
                                    placeholder="e.g. Budapest, Hungary" class="form-input">
                            </div>

                            <div class="form-group">
                                <label for="country" class="form-label" data-i18n="addNewPlace.country">
                                    Country *
                                </label>
                                <input type="text" id="country" name="country" required
                                    data-i18n-placeholder="addNewPlace.countryPlaceholder"
                                    placeholder="Start typing, e.g. Hungary" class="form-input" autocomplete="off">
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label for="visitedDate" class="form-label" data-i18n="addNewPlace.visitedDate">
                                        Start Date *
                                    </label>
                                    <input type="text" id="visitedDate" name="visitedDate" required class="form-input">
                                </div>

                                <div class="form-group">
                                    <label for="visitedEndDate" class="form-label"
                                        data-i18n="addNewPlace.visitedEndDate">
                                        End Date
                                    </label>
                                    <input type="text" id="visitedEndDate" name="visitedEndDate" class="form-input">
                                </div>
                            </div>

                            <div class="form-group">
                                <span class="form-label" data-i18n="addNewPlace.rating">Rating</span>
                                <div class="star-rating" role="group" aria-label="Rating">
                                    <button type="button" class="star-btn" data-rating="1" aria-label="1 star">
                                        <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polygon
                                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                        </svg>
                                    </button>
                                    <button type="button" class="star-btn" data-rating="2" aria-label="2 stars">
                                        <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polygon
                                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                        </svg>
                                    </button>
                                    <button type="button" class="star-btn" data-rating="3" aria-label="3 stars">
                                        <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polygon
                                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                        </svg>
                                    </button>
                                    <button type="button" class="star-btn" data-rating="4" aria-label="4 stars">
                                        <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polygon
                                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                        </svg>
                                    </button>
                                    <button type="button" class="star-btn" data-rating="5" aria-label="5 stars">
                                        <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polygon
                                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                        </svg>
                                    </button>
                                </div>
                                <input type="hidden" id="rating" name="rating" value="">
                            </div>

                            <div class="form-group">
                                <label for="description" class="form-label" data-i18n="addNewPlace.description">
                                    Short Description
                                </label>
                                <input type="text" id="description" name="description"
                                    data-i18n-placeholder="addNewPlace.descriptionPlaceholder"
                                    placeholder="Brief highlight of your visit" class="form-input">
                            </div>

                            <div class="form-group">
                                <label for="notes" class="form-label" data-i18n="addNewPlace.notes">
                                    Notes & Memories
                                </label>
                                <textarea id="notes" name="notes" rows="4"
                                    data-i18n-placeholder="addNewPlace.notesPlaceholder"
                                    placeholder="Share your experiences, recommendations, and favorite moments..."
                                    class="form-input form-textarea"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="photos" class="form-label" data-i18n="addNewPlace.photos">Photos</label>
                                <div class="photo-upload-shell">
                                    <label class="upload-zone" for="photos">
                                        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="48"
                                            height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                            <polyline points="17 8 12 3 7 8" />
                                            <line x1="12" x2="12" y1="3" y2="15" />
                                        </svg>
                                        <p class="upload-text" data-i18n="addNewPlace.photosPlaceholder">Click to upload
                                            photos</p>
                                        <p class="upload-hint" data-i18n="addNewPlace.photosHint">PNG, JPG up to 10MB
                                        </p>
                                        <input type="file" id="photos" name="photos"
                                            accept="image/png,image/jpeg,image/jpg" class="upload-input" multiple>
                                    </label>
                                    <div id="photoPreviewGrid" class="photo-preview-grid" hidden></div>
                                    <p id="photoFormatErrors" class="photo-upload-errors" hidden role="alert"></p>
                                </div>
                            </div>

                            <div id="submitProgress" class="submit-progress" hidden role="status" aria-live="polite">
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-add">
                                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10" />
                                        <path d="M12 8v8" />
                                        <path d="M8 12h8" />
                                    </svg>
                                    <span data-i18n="addNewPlace.add">Add Place</span>
                                </button>
                                <button type="button" class="btn-cancel" id="cancelBtn"
                                    data-i18n="addNewPlace.cancel">Cancel</button>
                            </div>

                        </form>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../../scripts/visitedPlaces/addNewPlace.js"></script>
    <script src="../../scripts/loginRegister/modal.js" defer></script>
</body>

</html>
