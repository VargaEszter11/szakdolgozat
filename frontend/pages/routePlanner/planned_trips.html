<!DOCTYPE html>
<html lang="en" data-defer-app-ready>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/scripts/utils/boot.js"></script>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/visited-places.css">
    <link rel="stylesheet" href="/styles/planned-trips.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="icon" href="/pictures/marker.png">
    <title data-i18n="plannedTrips.pageTitle">Planned Trips – Planventure</title>

    <script src="/scripts/utils/apiConfig.js"></script>
    <script src="/scripts/utils/themeLoader.js"></script>
    <script src="/scripts/utils/authGuard.js"></script>
    <script src="/scripts/utils/dropdown.js"></script>
    <script src="/scripts/utils/countries.js"></script>
    <script src="/scripts/i18n/translations.js"></script>
    <script src="/scripts/i18n/i18n.js"></script>
    <script src="/scripts/utils/sidebarHeader.js"></script>
</head>

<body>
    <div class="main-page main-page-home">

        <header id="app-header" class="main-header main-page-home-header"></header>

        <div class="main-page-home-body">

            <aside id="app-sidebar" class="main-page-home-sidebar"></aside>

            <main class="main-content main-page-home-content planned-trips-page">
                <div class="main-page-home-content-inner">

                    <div class="main-page-home-content-header">
                        <div class="main-page-home-intro">
                            <h1 class="main-page-home-title" data-i18n="plannedTrips.title">
                                Planned Trips
                            </h1>
                            <p class="main-page-home-subtitle muted" data-i18n="plannedTrips.subtitle">
                                Your upcoming adventures
                            </p>
                        </div>

                        <div class="planned-trips-header-actions">
                            <a href="/trips/new" class="btn-add">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M12 8v8" />
                                    <path d="M8 12h8" />
                                </svg>
                                <span data-i18n="plannedTrips.newTrip">New Trip</span>
                            </a>
                        </div>
                    </div>

                    <section id="shareInboxSection" class="share-inbox-section hidden">
                        <h2 class="share-inbox-title" data-i18n="plannedTrips.shareInboxTitle">Shared with you</h2>
                        <div id="shareInbox" class="share-inbox-list" aria-live="polite"></div>
                    </section>

                    <div id="tripLists" class="planned-trips-lists">
                        <section id="upcomingTripsSection" class="trip-list-section hidden">
                            <h2 class="trip-list-section-title" data-i18n="plannedTrips.upcomingSection">Upcoming trips
                            </h2>
                            <div id="tripCards" class="travel-logs-list" aria-live="polite"></div>
                        </section>

                        <section id="pastTripsSection" class="trip-list-section hidden">
                            <h2 class="trip-list-section-title" data-i18n="plannedTrips.pastSection">Past trips</h2>
                            <div id="pastTripCards" class="travel-logs-list" aria-live="polite"></div>
                        </section>
                    </div>

                    <div id="emptyState" class="card empty-state hidden">
                        <p class="empty-state-text" data-i18n="plannedTrips.noTripsPlannedYet">
                            No trips planned yet
                        </p>
                        <a href="/trips/new" class="btn-add">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 8v8" />
                                <path d="M8 12h8" />
                            </svg>
                            <span data-i18n="plannedTrips.planFirstTrip">Plan Your First Trip</span>
                        </a>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <template id="tripDetailsModalTemplate">
        <div class="trip-details-modal-overlay planned-trips-trip-popup" id="tripDetailsModal" role="dialog"
            aria-modal="true" aria-labelledby="tripDetailsTitle">
            <div class="trip-details-modal planned-trips-trip-popup__panel" id="tripDetailsModalBox">
                <div class="trip-details-header planned-trips-trip-popup__header">
                    <h2 id="tripDetailsTitle" class="trip-details-title"></h2>
                    <button type="button" class="trip-details-close" aria-label="Close"
                        data-i18n-aria-label="plannedTrips.editCloseAria">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>

                <div class="trip-details-content">
                    <div class="trip-details-info">
                        <p><strong data-i18n="plannedTrips.editFieldStartDate">Start date</strong>: <span
                                id="tripDetailsStartDate"></span></p>
                        <p><strong data-i18n="plannedTrips.editFieldEndDate">End date</strong>: <span
                                id="tripDetailsEndDate"></span></p>
                        <p><strong data-i18n="plannedTrips.people">People</strong>: <span
                                id="tripDetailsPeople">1</span></p>
                        <p><strong data-i18n="plannedTrips.bookingStatus">Booking status</strong>: <span
                                id="tripDetailsBookedStatus"></span></p>
                        <p id="tripDetailsStartCityWrap" class="hidden">
                            <strong data-i18n="plannedTrips.editFieldStartCity">Starting city</strong>:
                            <span id="tripDetailsStartCity"></span>
                        </p>
                        <p id="tripDetailsSharedByWrap" class="hidden">
                            <strong data-i18n="plannedTrips.sharedByLabel">Shared by</strong>:
                            <span id="tripDetailsSharedBy"></span>
                        </p>
                    </div>

                    <div id="tripDetailsMapSection" class="trip-details-map-section hidden">
                        <h3 id="tripDetailsMapHeading" class="trip-details-map-heading"
                            data-i18n="plannedTrips.mapRouteHeading">Route map</h3>
                        <div id="tripDetailsMap" class="trip-details-map" role="img"
                            aria-labelledby="tripDetailsMapHeading"></div>
                        <p id="tripDetailsMapNote" class="trip-details-map-note muted hidden"></p>
                    </div>

                    <h3 id="tripDetailsStopsHeading">
                        <span data-i18n="plannedTrips.tripStops">Trip stops</span> (<span
                            id="tripDetailsStopsCount">0</span>)
                    </h3>

                    <div class="trip-stops-list" id="tripDetailsStopsList"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="tripEditModalTemplate">
        <div class="trip-details-modal-overlay planned-trips-trip-popup" id="tripEditModal" role="dialog"
            aria-modal="true" aria-labelledby="tripEditHeading">
            <div class="trip-details-modal planned-trips-trip-popup__panel" id="tripEditModalBox">
                <div class="trip-details-header planned-trips-trip-popup__header">
                    <h2 id="tripEditHeading" class="trip-details-title" data-i18n="plannedTrips.editModalTitle">Edit
                        trip</h2>
                    <button type="button" class="trip-details-close" aria-label="Close"
                        data-i18n-aria-label="plannedTrips.editCloseAria">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <div class="trip-details-content">
                    <div class="trip-details-info trip-details-info--form">
                        <div class="trip-details-form-field">
                            <label for="editTripTitle" data-i18n="plannedTrips.editFieldTitle">Title</label>
                            <input type="text" id="editTripTitle" class="trip-details-text-input" required
                                maxlength="200" autocomplete="off" />
                        </div>
                        <div class="trip-details-form-field">
                            <label for="editTripStartCity" data-i18n="plannedTrips.editFieldStartCity">Starting
                                city</label>
                            <input type="text" id="editTripStartCity" class="trip-details-text-input" maxlength="200"
                                autocomplete="off" />
                        </div>
                        <div class="trip-details-form-row-2">
                            <div class="trip-details-form-field">
                                <label for="editTripStartDate" data-i18n="plannedTrips.editFieldStartDate">Start
                                    date</label>
                                <input type="text" id="editTripStartDate" class="trip-details-text-input" autocomplete="off" />
                            </div>
                            <div class="trip-details-form-field">
                                <label for="editTripEndDate" data-i18n="plannedTrips.editFieldEndDate">End date</label>
                                <input type="text" id="editTripEndDate" class="trip-details-text-input" autocomplete="off" />
                            </div>
                        </div>
                        <div class="trip-details-form-field">
                            <label for="editTripPeople" data-i18n="plannedTrips.editFieldPeople">Travellers</label>
                            <input type="number" id="editTripPeople" class="trip-details-text-input" min="1" max="20"
                                step="1" required />
                        </div>
                    </div>
                    <h3 data-i18n="plannedTrips.editStopsHeading">Stops</h3>
                    <div id="editStopsList" class="trip-stops-list"></div>
                    <button type="button" id="editAddStopBtn" class="btn-add">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 8v8" />
                            <path d="M8 12h8" />
                        </svg>
                        <span data-i18n="plannedTrips.editAddStop">Add stop</span>
                    </button>
                    <div class="trip-details-form-actions">
                        <button type="button" id="tripEditSaveBtn" class="btn-add"
                            data-i18n="plannedTrips.editSave">Save</button>
                        <button type="button" id="tripEditCancelBtn" class="btn-cancel"
                            data-i18n="plannedTrips.editCancel">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tripShareModalTemplate">
        <div class="trip-details-modal-overlay planned-trips-trip-popup" id="tripShareModal" role="dialog"
            aria-modal="true" aria-labelledby="tripShareTitle">
            <div class="trip-details-modal planned-trips-trip-popup__panel" id="tripShareModalBox">
                <div class="trip-details-header planned-trips-trip-popup__header">
                    <h2 id="tripShareTitle" class="trip-details-title" data-i18n="plannedTrips.shareTrip">Share trip
                    </h2>
                    <button type="button" class="trip-details-close" aria-label="Close"
                        data-i18n-aria-label="plannedTrips.editCloseAria">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <div class="trip-details-content">
                    <div class="trip-share-section">
                        <h3 data-i18n="plannedTrips.copyLink">Copy link</h3>
                        <p class="muted" data-i18n="plannedTrips.copyLinkHint">Anyone with this link can view the
                            itinerary (no login required).</p>
                        <div class="trip-share-link-row">
                            <input type="text" id="tripShareLinkInput" class="trip-details-text-input" readonly />
                            <button type="button" id="tripShareCopyBtn" class="btn-add"
                                data-i18n="plannedTrips.copyLink">Copy link</button>
                        </div>
                    </div>
                    <div class="trip-share-section">
                        <h3 data-i18n="plannedTrips.sendToUser">Send to user</h3>
                        <label for="tripShareUserSearch" data-i18n="plannedTrips.searchUser">Search by username</label>
                        <input type="text" id="tripShareUserSearch" class="trip-details-text-input"
                            autocomplete="off" />
                        <div id="tripShareUserResults" class="trip-share-user-results"></div>
                        <button type="button" id="tripShareSendBtn" class="btn-add" disabled
                            data-i18n="plannedTrips.sendToUser">Send to user</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/scripts/loginRegister/modal.js"></script>
    <script src="/scripts/utils/tripMapHelper.js"></script>
    <script src="/scripts/utils/tripDisplayHelper.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/hu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/de.js"></script>
    <script src="/scripts/utils/datePicker.js?v=7"></script>
    <script src="/scripts/routePlanner/loadPlans.js?v=edit-dates-11" defer></script>

</body>

</html>
