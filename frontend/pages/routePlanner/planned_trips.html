<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>Planned Trips – TravelApp</title>
    <script src="../../scripts/themeLoader.js"></script>
    <script src="../../scripts/navToggle.js" defer></script>
    <script src="../../scripts/i18n/translations.js"></script>
    <script src="../../scripts/i18n/i18n.js"></script>
</head>

<body>
    <div class="main-page">
        <header class="main-header">
            <a href="../main_page.html" class="nav-logo">
                <img src="../../pictures/marker.png" alt="TravelApp">
            </a>
            <button class="hamburger-btn" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <nav class="main-nav">
                <a href="../visitedPlaces/visited_places.html" class="nav-link" data-i18n="nav.visitedPlaces">Visited
                    Places</a>
                <a href="../visitedPlaces/add_new_place.html" class="nav-link" data-i18n="nav.addNewPlace">Add New
                    Place</a>
                <a href="plan_new_trip.html" class="nav-link" data-i18n="nav.planNewTrip">Plan New Trip</a>
                <a href="surprise_me.html" class="nav-link" data-i18n="nav.surpriseMe">Surprise Me!</a>
                <a href="planned_trips.html" class="nav-link nav-link-active" data-i18n="nav.plannedTrips">Planned
                    Trips</a>
                <a href="../loginRegister/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
                <a href="../settings/settings.html" class="nav-link" data-i18n="nav.settings">Settings</a>
            </nav>
        </header>

        <main class="main-content planned-trips-page">
            <div class="planned-trips-inner">
                <div class="planned-trips-header">
                    <div>
                        <h1 class="planned-trips-title" data-i18n="plannedTrips.title">Planned Trips</h1>
                        <p class="planned-trips-subtitle" data-i18n="plannedTrips.subtitle">Your upcoming adventures</p>
                    </div>
                    <a href="plan_new_trip.html" class="btn-add" data-i18n="plannedTrips.newTrip">+ New Trip</a>
                </div>

                <div id="tripCards" class="trip-cards">
                    <!-- Trip cards rendered by loadPlans.js -->
                </div>

                <div id="emptyState" class="empty-state hidden">
                    <p class="empty-state-text" data-i18n="plannedTrips.noTripsPlannedYet">No trips planned yet</p>
                    <a href="plan_new_trip.html" class="btn-submit" data-i18n="plannedTrips.planFirstTrip">Plan Your
                        First Trip</a>
                </div>
            </div>
        </main>
    </div>

    <script src="../../scripts/routePlanner/loadPlans.js"></script>
</body>

</html>
