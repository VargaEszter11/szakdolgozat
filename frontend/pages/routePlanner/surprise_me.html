<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="icon" type="image/png" sizes="40x40" href="../../pictures/marker.png">
    <title>Surprise Me – TravelApp</title>
    <script src="../../scripts/utils/themeLoader.js"></script>
    <script src="../../scripts/utils/authGuard.js"></script>
    <script src="../../scripts/utils/navToggle.js" defer></script>
    <script src="../../scripts/i18n/translations.js"></script>
    <script src="../../scripts/i18n/i18n.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/hu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/de.js"></script>
    <script src="../../scripts/utils/datePicker.js"></script>
</head>

<body>
    <div class="main-page">
        <header class="main-header">
            <a href="../main_page.html" class="nav-logo">
                <img src="../../pictures/marker.png" alt="TravelApp">
            </a>
            <button class="hamburger-btn" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <nav class="main-nav">
                <a href="../visitedPlaces/visited_places.html" class="nav-link" data-i18n="nav.visitedPlaces">Visited
                    Places</a>
                <a href="../visitedPlaces/add_new_place.html" class="nav-link" data-i18n="nav.addNewPlace">Add New
                    Place</a>
                <a href="plan_new_trip.html" class="nav-link" data-i18n="nav.planNewTrip">Plan New Trip</a>
                <a href="surprise_me.html" class="nav-link nav-link-active" data-i18n="nav.surpriseMe">Surprise Me!</a>
                <a href="planned_trips.html" class="nav-link" data-i18n="nav.plannedTrips">Planned Trips</a>
                <a href="../loginRegister/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
                <a href="../settings/settings.html" class="nav-link" data-i18n="nav.settings">Settings</a>
            </nav>
        </header>

        <main class="main-content route-planner-page">
            <div class="route-planner-inner">
                <div class="route-planner-header route-planner-header-flex">
                    <div>
                        <h1 class="route-planner-title" data-i18n="surpriseMe.title">Surprise Me!</h1>
                        <p class="route-planner-subtitle" data-i18n="surpriseMe.subtitle">Generate a random travel
                            suggestion based on your preferences.</p>
                    </div>
                    <a href="plan_new_trip.html" class="btn-add">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 8v8" />
                            <path d="M8 12h8" />
                        </svg>
                        <span data-i18n="surpriseMe.planFromOptions">Plan From Options</span>
                    </a>
                </div>

                <div class="card add-place-card">
                    <form id="randomTripForm" class="add-place-form">
                        <div class="form-group">
                            <label for="startingCity" class="form-label" data-i18n="surpriseMe.startingCity">Starting
                                City *</label>
                            <input type="text" id="startingCity" name="startingCity"
                                data-i18n-placeholder="surpriseMe.startingCityPlaceholder" placeholder="e.g. Budapest"
                                required class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="startDate" class="form-label" data-i18n="surpriseMe.startDate">Start Date
                                *</label>
                            <input type="date" id="startDate" name="startDate" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="endDate" class="form-label" data-i18n="surpriseMe.endDate">End Date *</label>
                            <input type="date" id="endDate" name="endDate" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="budget" class="form-label" data-i18n="surpriseMe.budget">Budget (€) *</label>
                            <input type="number" id="budget" name="budget"
                                data-i18n-placeholder="surpriseMe.budgetPlaceholder" placeholder="e.g. 1000" required
                                class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="preferences" class="form-label" data-i18n="surpriseMe.preferences">Preferences
                                (comma-separated)</label>
                            <input type="text" id="preferences" name="preferences"
                                data-i18n-placeholder="surpriseMe.preferencesPlaceholder"
                                placeholder="e.g. museums, hiking" class="form-input">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-add" id="generateBtn">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M12 8v8" />
                                    <path d="M8 12h8" />
                                </svg>
                                <span data-i18n="surpriseMe.generateRandomTrip">Generate Random Trip</span>
                            </button>
                            <a href="plan_new_trip.html" class="btn-cancel" data-i18n="surpriseMe.cancel">Cancel</a>
                        </div>
                    </form>

                    <!-- Loading State -->
                    <div id="loadingState" style="display: none; padding: 2rem; text-align: center;">
                        <p data-i18n="surpriseMe.generating">Generating...</p>
                    </div>

                    <!-- Results -->
                    <div id="resultsContainer" style="display: none; margin-top: 2rem;">
                        <h3 data-i18n="surpriseMe.yourRandomTrip">Your Random Trip</h3>
                        <div id="tripResults"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../scripts/loginRegister/modal.js"></script>
    <script type="module" src="../../scripts/routePlanner/surpriseMe.js"></script>
</body>

</html>
