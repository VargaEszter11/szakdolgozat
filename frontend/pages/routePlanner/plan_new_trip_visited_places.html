<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="icon" href="../../pictures/marker.png">
    <title>Plan from Visited Places – TravelApp</title>
    <script src="../../scripts/themeLoader.js"></script>
</head>
<body>
    <div class="main-page">
        <a href="../main_page.html" class="nav-logo" style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
            <img src="../../pictures/marker.png" alt="TravelApp" width="32" height="32">
        </a>
        <header class="main-header">
            <nav class="main-nav">
                <a href="../visitedPlaces/visited_places.html" class="nav-link">Visited Places</a>
                <a href="../visitedPlaces/add_new_place.html" class="nav-link">Add New Place</a>
                <a href="plan_new_trip.html" class="nav-link nav-link-active">Plan New Trip</a>
                <a href="surprise_me.html" class="nav-link">Surprise Me!</a>
                <a href="planned_trips.html" class="nav-link">Planned Trips</a>
                <a href="../loginRegister/profile.html" class="nav-link">Profile</a>
                <a href="../settings/settings.html" class="nav-link">Settings</a>
            </nav>
        </header>

        <main class="main-content route-planner-page">
            <div class="route-planner-inner">
                <div class="route-planner-header">
                    <h1 class="route-planner-title">Plan from Visited Places</h1>
                    <p class="route-planner-subtitle">Select where you want to travel next. The default will be your visited countries.</p>
                </div>

                <div class="card add-place-card">
                    <form id="visitedPlanForm" class="add-place-form">
                        <div class="form-group">
                            <label for="startingCity" class="form-label">Starting City *</label>
                            <input type="text" id="startingCity" name="startingCity" placeholder="e.g. Budapest" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="travelLength" class="form-label">Trip Length (days) *</label>
                            <input type="number" id="travelLength" name="travelLength" placeholder="e.g. 7" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="budget" class="form-label">Budget (€) *</label>
                            <input type="number" id="budget" name="budget" placeholder="e.g. 1000" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="preferences" class="form-label">Preferences (comma-separated)</label>
                            <input type="text" id="preferences" name="preferences" placeholder="e.g. museums, hiking" class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="visitedPlaces" class="form-label">Places you would like to visit (comma-separated) *</label>
                            <input type="text" id="visitedPlaces" name="visitedPlaces" placeholder="e.g. Paris, Berlin, Rome" required class="form-input">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-add" id="generateBtn">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                                Create Plan
                            </button>
                            <a href="plan_new_trip.html" class="btn-cancel">Cancel</a>
                        </div>
                    </form>

                    <!-- Loading State -->
                    <div id="loadingState" style="display: none; padding: 2rem; text-align: center;">
                        <p>Generating your trip...</p>
                    </div>

                    <!-- Results -->
                    <div id="resultsContainer" style="display: none; margin-top: 2rem;">
                        <h3>Your Trip from Visited Places</h3>
                        <div id="tripResults"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../../scripts/routePlanner/planVisited.js"></script>
</body>
</html>
